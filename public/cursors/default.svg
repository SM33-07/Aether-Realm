<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="10,2 14,10 10,18 6,10" fill="#06b6d4" opacity="0.9"/>
    <polygon points="10,4 12.5,10 10,16 7.5,10" fill="#a78bfa" opacity="0.7"/>
    <polygon points="10,6 11,10 10,14 9,10" fill="white" opacity="0.5"/>
  </g>
</svg>
