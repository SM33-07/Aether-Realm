<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="14,2 20,14 14,26 8,14" fill="#8b5cf6" opacity="0.9"/>
    <polygon points="14,5 18,14 14,23 10,14" fill="#06b6d4" opacity="0.7"/>
    <polygon points="14,8 16,14 14,20 12,14" fill="white" opacity="0.6"/>
  </g>
</svg>
